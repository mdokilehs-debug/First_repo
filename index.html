<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>မြန်မာကုဒ် Editor</title>
<style>
body{font-family:sans-serif;background:#eef2f7;padding:16px;color:#1e293b}
h1{color:#087443}
.panel{background:white;padding:14px;margin:14px 0;border-radius:12px}
textarea{box-sizing:border-box;width:100%;height:220px;background:#111827;color:#d1fae5;padding:10px;font-size:15px}
button{padding:12px;background:#087443;color:white;border:0;border-radius:8px;margin:8px 4px}
iframe{width:100%;height:220px;background:white;border:1px solid #ccc}
</style>
</head>
<body>
<h1>🇲🇲 မြန်မာကုဒ်</h1>
<p>ကိုယ်တိုင် ကုဒ်ရေးပြီး Run နှိပ်ပါ။</p>
<div class="panel">
<h3>HTML ကုဒ်ရေးရန်</h3>
<textarea id="code"><h1>မင်္ဂလာပါ!</h1>
<p>ဒါက ကျွန်တော့်ရဲ့ ပထမဆုံး ဝဘ်စာမျက်နှာပါ။</p>
<button onclick="alert('မြန်မာကုဒ်မှ ကြိုဆိုပါတယ်!')">နှိပ်ကြည့်ပါ</button></textarea>
<button onclick="document.getElementById('preview').srcdoc=document.getElementById('code').value">▶ Run</button>
<button onclick="document.getElementById('code').value='<h1>မင်္ဂလာပါ!</h1>';document.getElementById('preview').srcdoc=document.getElementById('code').value">Reset</button>
</div>
<div class="panel">
<h3>ရလဒ် (Output)</h3>
<iframe id="preview" title="ရလဒ်"></iframe>
</div>
<script>
document.getElementById('preview').srcdoc=document.getElementById('code').value;
</script>
</body>
</html>
