
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>မြန်မာကုဒ်</title>
<style>
body{font-family:sans-serif;background:#eef2f7;padding:16px;color:#1e293b}
h1{color:#087443}
.panel{background:white;padding:14px;margin:14px 0;border-radius:12px}
textarea{box-sizing:border-box;width:100%;height:180px;background:#111827;color:#d1fae5;padding:10px;font-size:15px}
button{padding:12px;background:#087443;color:white;border:0;border-radius:8px;margin:8px 4px}
iframe{width:100%;height:220px;background:white;border:1px solid #ccc}
label{display:block;margin:12px 0}
</style>
</head>
<body>
<h1>🇲🇲 မြန်မာကုဒ်</h1>
<p>ကုဒ်ရေးပါ၊ ဒီဇိုင်းပြောင်းပါ၊ Run နှိပ်ပါ။</p>
<div class="panel">
<h3>ဒီဇိုင်းရွေးရန်</h3>
<label>စာလုံးအရောင်
<input type="color" id="txtColor" value="#087443">
</label>
<label>နောက်ခံအရောင်
<input type="color" id="bgColor" value="#ffffff">
</label>
<label>စာလုံးအရွယ်အစား
<select id="txtSize">
<option value="16px">ပုံမှန်</option>
<option value="22px">ကြီး</option>
<option value="30px">အလွန်ကြီး</option>
</select>
</label>
</div>
<div class="panel">
<h3>HTML ကုဒ်ရေးရန်</h3>
<div style="margin: 10px 0;">
  <label for="templateSelect">နမူနာကုဒ် ရွေးပါ</label>
  <select id="templateSelect" onchange="loadTemplate(this.value)">
    <option value="">-- နမူနာရွေးပါ --</option>
    <option value="hello">မင်္ဂလာပါ စာမျက်နှာ</option>
    <option value="about">ကိုယ့်အကြောင်း</option>
    <option value="color">အရောင်စုံ စာမျက်နှာ</option>
  </select>
</div>
<div class="project-box">
  <h3>📁 My Projects — ကျွန်ုပ်၏ ပရောဂျက်များ</h3>

  <label for="projectName">ပရောဂျက်အမည်</label>
  <input
    type="text"
    id="projectName"
    placeholder="ဥပမာ - ကျွန်ုပ်၏ ဝဘ်ဆိုက်"
  >

  <button type="button" onclick="saveProject()">
    💾 ပရောဂျက်သိမ်းမယ်
  </button>

  <label for="projectList">သိမ်းထားသော ပရောဂျက်များ</label>
  <select id="projectList">
    <option value="">-- ပရောဂျက်ရွေးပါ --</option>
  </select>

  <button type="button" onclick="openProject()">
    📂 ပရောဂျက်ဖွင့်မယ်
  </button>

  <button type="button" onclick="deleteProject()">
    🗑️ ပရောဂျက်ဖျက်မယ်
  </button>
</div>
<input type="file" id="htmlFile" accept=".html,.htm,text/html" onchange="loadHTMLFile(event)">
<textarea id="code"><h1>မင်္ဂလာပါ!</h1>
<p>ဒါက မြန်မာကုဒ်ပါ။</p>
<button onclick="alert('ကြိုဆိုပါတယ်!')">နှိပ်ကြည့်ပါ</button></textarea>
<button onclick="runCode()">▶ Run</button>
<button onclick="resetCode()">Reset</button>
<button onclick="saveHTML()">💾 Save HTML</button>
</div>
<div class="panel">
<h3>ရလဒ် (Output)</h3>
<iframe id="preview" title="ရလဒ်"></iframe>
</div>
<script>
function runCode(){
const c=document.getElementById('code').value;
const color=document.getElementById('txtColor').value;
const bg=document.getElementById('bgColor').value;
const size=document.getElementById('txtSize').value;
document.getElementById('preview').srcdoc=
'<style>body{color:'+color+';background:'+bg+';font-size:'+size+';font-family:sans-serif;padding:12px}</style>'+c;
}
function loadTemplate(type) {
  const templates = {
    hello: '<h1>မင်္ဂလာပါ!</h1><p>မြန်မာကုဒ်မှ ကြိုဆိုပါတယ်။</p>',
    about: '<h1>ကျွန်ုပ်အကြောင်း</h1><p>ကျွန်ုပ်သည် HTML ကို လေ့လာနေပါသည်။</p>',
    color: '<h1 style="color: blue;">အရောင်စုံ စာမျက်နှာ</h1><p style="color: green;">ဒါက နမူနာစာသားပါ။</p>'
  };

  if (!templates[type]) return;

  document.getElementById('code').value = templates[type];
  localStorage.setItem('myanmar_code_saved', templates[type]);
  runCode();
}
function resetCode(){
document.getElementById('code').value='<h1>မင်္ဂလာပါ!</h1>\n<p>ဒါက မြန်မာကုဒ်ပါ။</p>';
runCode();
}
runCode();
function saveHTML(){
  const code = document.getElementById('code').value;
  const blob = new Blob([code], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = prompt('ဖိုင်အမည်ထည့်ပါ', 'myanmar-code.html') || 'myanmar-code.html';
  a.click();
  URL.revokeObjectURL(url);
}
function loadHTMLFile(event){
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(){
    document.getElementById('code').value = reader.result;
    runCode();
  };
  reader.readAsText(file);
}
const STORAGE_KEY = 'myanmar_code_saved';

const codeBox = document.getElementById('code');

codeBox.addEventListener('input', function() {
  localStorage.setItem(STORAGE_KEY, codeBox.value);
});

const savedCode = localStorage.getItem(STORAGE_KEY);
if (savedCode !== null) {
  codeBox.value = savedCode;
}
const PROJECTS_KEY = 'myanmar_code_projects';

function getProjects() {
  try {
    return JSON.parse(localStorage.getItem(PROJECTS_KEY) || '{}');
  } catch (e) {
    return {};
  }
}

function refreshProjects() {
  const list = document.getElementById('projectList');
  if (!list) return;

  const projects = getProjects();
  list.innerHTML = '<option value="">-- ပရောဂျက်ရွေးပါ --</option>';

  Object.keys(projects).forEach(function(name) {
    const option = document.createElement('option');
    option.value = name;
    option.textContent = name;
    list.appendChild(option);
  });
}

function saveProject() {
  const name = document.getElementById('projectName').value.trim();
  const code = document.getElementById('code').value;

  if (!name) {
    alert('ပရောဂျက်အမည် အရင်ထည့်ပါ။');
    return;
  }

  const projects = getProjects();
  projects[name] = code;
  localStorage.setItem(PROJECTS_KEY, JSON.stringify(projects));

  refreshProjects();
  document.getElementById('projectList').value = name;
  alert('ပရောဂျက် သိမ်းပြီးပါပြီ။');
}

function openProject() {
  const name = document.getElementById('projectList').value;
  const projects = getProjects();

  if (!name || !(name in projects)) {
    alert('ဖွင့်ချင်တဲ့ ပရောဂျက်ကို ရွေးပါ။');
    return;
  }

  document.getElementById('code').value = projects[name];
  localStorage.setItem('myanmar_code_saved', projects[name]);
  document.getElementById('projectName').value = name;
  runCode();
}

function deleteProject() {
  const name = document.getElementById('projectList').value;

  if (!name) {
    alert('ဖျက်ချင်တဲ့ ပရောဂျက်ကို ရွေးပါ။');
    return;
  }

  if (!confirm('"' + name + '" ကို ဖျက်မှာ သေချာပါသလား?')) return;

  const projects = getProjects();
  delete projects[name];
  localStorage.setItem(PROJECTS_KEY, JSON.stringify(projects));

  refreshProjects();
  alert('ပရောဂျက် ဖျက်ပြီးပါပြီ။');
}

refreshProjects();
</script>
</body>
</html>
